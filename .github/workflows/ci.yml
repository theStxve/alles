name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tools
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip pyinstaller pytest
          choco install innosetup --no-progress -y
      - name: Fetch Everything SDKs
        shell: pwsh
        run: python scripts/fetch_sdk.py
      - name: SDK smoke tests (Everything 1.4 + 1.5)
        shell: pwsh
        run: |
          # failures are reported as annotations (readable without log access)
          $out = python -m pytest -v -rs tests/test_sdk3.py tests/test_sdk.py 2>&1
          $code = $LASTEXITCODE
          $out | Write-Output
          if ($code -ne 0) {
            $out | Select-Object -Last 25 | ForEach-Object { Write-Output "::error::$_" }
            exit $code
          }
      - name: Build exe, installer and portable zip
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Installer smoke test (install + uninstall)
        shell: pwsh
        run: ./scripts/test_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ALLES-build
          path: |
            dist/ALLES.exe
            dist/ALLES-Setup-*.exe
            dist/ALLES-*-portable.zip
          retention-days: 14
