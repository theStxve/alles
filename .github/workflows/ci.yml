name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tools
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip pyinstaller
          choco install innosetup --no-progress -y
      - name: SDK smoke test
        run: |
          python scripts/fetch_sdk.py
          python -c "from alles import everything_sdk as es; print(es.EverythingSDK().get_version())"
      - name: Build exe, installer and portable zip
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Installer smoke test (install + uninstall)
        shell: pwsh
        run: ./scripts/test_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ALLES-build
          path: |
            dist/ALLES.exe
            dist/ALLES-Setup-*.exe
            dist/ALLES-*-portable.zip
          retention-days: 14
