name: Release

# Push a tag like v2.0.0 to build ALLES.exe and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --upgrade pip pyinstaller pytest
      - name: Test
        run: python -m pytest -q
      - name: Check tag matches version
        shell: bash
        run: |
          VERSION=$(python -c "import alles; print(alles.__version__)")
          [ "v$VERSION" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != v$VERSION"; exit 1; }
      - name: Fetch Everything SDK
        run: python scripts/fetch_sdk.py
      - name: Build exe
        run: python -m PyInstaller ALLES.spec --noconfirm --clean
      - name: Checksum
        shell: bash
        run: |
          cd dist
          mv ALLES.exe "ALLES-${GITHUB_REF_NAME}.exe"
          sha256sum "ALLES-${GITHUB_REF_NAME}.exe" > "ALLES-${GITHUB_REF_NAME}.exe.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ALLES-*.exe
            dist/ALLES-*.exe.sha256
          generate_release_notes: true
